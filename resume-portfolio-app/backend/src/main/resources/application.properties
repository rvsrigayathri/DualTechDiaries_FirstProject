# Server
server.port=${PORT:8080}

# Datasource Configuration
# Supports SPRING_DATASOURCE_URL, DATABASE_URL, and defaults to local H2 file database.
# DatabaseConfig automatically normalizes postgres:// or postgresql:// to jdbc:postgresql://
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:h2:file:./data/resumedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}

# H2 web console (accessible at http://localhost:8080/h2-console during local dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Schema Strategy
# Automatically creates and updates tables for PostgreSQL and H2
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# CORS Allowed Origins (comma-separated, supports wildcards like https://*.vercel.app)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://frontend-rvsrigayathris-projects.vercel.app,https://*.vercel.app}
