# Server
server.port=8080

# H2 in-memory database (file mode can be enabled later when persistence is needed)
spring.datasource.url=jdbc:h2:mem:resumedb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 web console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate — commented out until Phase 3 entities are added.
# Uncomment these when spring-boot-starter-data-jpa is added to pom.xml.
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# spring.jpa.hibernate.ddl-auto=create-drop
