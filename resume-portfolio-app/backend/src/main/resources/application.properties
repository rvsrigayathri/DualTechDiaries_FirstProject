# Server
server.port=${PORT:8080}

# Datasource Configuration
# Falls back to local H2 file database if cloud environment variables are not set.
# Cloud hosts (Render, Railway, etc.) override this with SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/resumedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# H2 web console (accessible at http://localhost:8080/h2-console during local dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate (Dialect is auto-detected by Hibernate 6 from JDBC URL)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# CORS Allowed Origins (comma-separated, supports wildcards like https://*.vercel.app)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://frontend-rvsrigayathris-projects.vercel.app,https://*.vercel.app}
